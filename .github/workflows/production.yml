name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  # 本番デプロイは2026-08-30にCloudflare Pagesからローカル(kensan1969)常駐サーバー
  # + Cloudflare Tunnelへ移行した。GitHub Actions(クラウドhosted runner)からは
  # このホストへ直接デプロイできないため、mainマージ後のデプロイは
  # scripts/deploy-local.shの手動実行に依存する(docs/deployment-local.md参照)。
  # このジョブはCI上で"mainがverify可能な状態にある"ことのみを継続確認する。
