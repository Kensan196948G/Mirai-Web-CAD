name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Lint, Test, Build, E2E, A11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  migration:
    name: Empty PostgreSQL Migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mirai
          POSTGRES_PASSWORD: mirai_ci_only
          POSTGRES_DB: mirai_web_cad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirai -d mirai_web_cad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mirai:mirai_ci_only@127.0.0.1:5432/mirai_web_cad
    steps:
      - uses: actions/checkout@v5
      - run: npm run db:verify

  recovery:
    name: PostgreSQL Backup and Restore Drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirai
          POSTGRES_PASSWORD: mirai_ci_only
          POSTGRES_DB: mirai_web_cad_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirai -d mirai_web_cad_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mirai:mirai_ci_only@127.0.0.1:5432/mirai_web_cad_source
      RESTORE_DATABASE_URL: postgresql://mirai:mirai_ci_only@127.0.0.1:5432/mirai_web_cad_recovery
      BACKUP_FILE: artifacts/mirai-web-cad.dump
      ALLOW_DATABASE_RESTORE: "yes"
    steps:
      - uses: actions/checkout@v5
      - run: npm run db:verify
      - name: Create empty recovery database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database mirai_web_cad_recovery"
      - run: npm run db:backup
      - name: Verify non-empty recovery database is rejected
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create table restore_guard (id integer)"
          if npm run db:restore; then
            echo "restore unexpectedly accepted a non-empty database" >&2
            exit 1
          fi
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop table restore_guard"
      - run: npm run db:restore

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan repository
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --redact --no-banner

  preview:
    name: Deploy Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: [application, migration, recovery, secret-scan]
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.number }}.mirai-web-cad.pages.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy preview
        run: >-
          npx wrangler pages deploy dist
          --project-name mirai-web-cad
          --branch "pr-${{ github.event.number }}"
          --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify preview
        env:
          PREVIEW_URL: https://pr-${{ github.event.number }}.mirai-web-cad.pages.dev
        run: |
          test "$(curl --retry 8 --retry-all-errors --silent --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/")" = "200"
          test "$(curl --retry 8 --retry-all-errors --silent --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/api/health")" = "200"
