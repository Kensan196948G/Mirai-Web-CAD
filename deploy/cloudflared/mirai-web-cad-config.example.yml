# Cloudflare Tunnel設定ファイルの例。
# 実運用では ~/.cloudflared/mirai-web-cad-config.yml に、
# `cloudflared tunnel create mirai-web-cad` が出力するUUIDを埋めて配置する。
# credentials-fileはリポジトリに含めない(cloudflared tunnel createが
# ~/.cloudflared/<UUID>.json として自動生成する)。
tunnel: <cloudflared tunnel create mirai-web-cad が出力するUUID>
credentials-file: /home/kensan/.cloudflared/<UUID>.json

ingress:
  - hostname: mirai-web-cad.mirai-dx-platform.com
    service: http://localhost:18812
  - service: http_status:404
